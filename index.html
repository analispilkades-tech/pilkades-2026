<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Live Count Pilkades Serempak 2026</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-gray-100 text-gray-800">

  <div class="max-w-7xl mx-auto p-6">
    <!-- Header -->
    <div class="flex justify-between items-center bg-white p-6 rounded-xl shadow-md mb-6">
      <div>
        <h1 class="text-2xl font-bold text-blue-900">HITUNG CEPAT PILKADES 2026</h1>
        <p class="text-gray-500 text-sm">Real-time Data Processing Engine</p>
      </div>
      <div class="flex items-center space-x-2">
        <span class="h-3 w-3 bg-green-500 rounded-full animate-ping"></span>
        <span class="text-sm font-semibold text-green-600">LIVE DATA</span>
      </div>
    </div>

    <!-- Filter Kecamatan & Desa -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
      <select id="filterKec" class="p-3 bg-white border rounded-lg shadow-sm" onchange="filterData()">
        <option value="">-- Semua Kecamatan --</option>
      </select>
      <select id="filterDesa" class="p-3 bg-white border rounded-lg shadow-sm" onchange="filterData()">
        <option value="">-- Semua Desa --</option>
      </select>
      <select id="filterTPS" class="p-3 bg-white border rounded-lg shadow-sm" onchange="filterData()">
        <option value="">-- Semua TPS (1-3) --</option>
      </select>
    </div>

    <!-- Tabel Rapi Data TPS -->
    <div class="bg-white rounded-xl shadow-md p-6">
      <h2 class="text-lg font-bold mb-4">Log Masuk TPS & Hasil Suara</h2>
      <div class="overflow-x-auto">
        <table class="w-full text-left border-collapse">
          <thead>
            <tr class="bg-gray-50 border-b">
              <th class="p-3">Kecamatan</th>
              <th class="p-3">Desa</th>
              <th class="p-3">TPS</th>
              <th class="p-3">Petugas</th>
              <th class="p-3">Total Suara</th>
              <th class="p-3">Status</th>
            </tr>
          </thead>
          <tbody id="tableBody">
            <!-- Data dimasukkan secara otomatis via JavaScript -->
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    const API_URL = "URL_WEB_APP_GAS_ANDA_DI_SINI";

    async function loadData() {
      try {
        const response = await fetch(API_URL);
        const data = await response.json();
        renderTable(data);
      } catch (err) {
        console.error("Gagal mengambil data:", err);
      }
    }

    function renderTable(data) {
      const tbody = document.getElementById("tableBody");
      tbody.innerHTML = "";
      
      data.forEach(item => {
        tbody.innerHTML += `
          <tr class="border-b hover:bg-gray-50">
            <td class="p-3">${item.Kecamatan}</td>
            <td class="p-3 font-semibold">${item.Desa}</td>
            <td class="p-3">${item.TPS}</td>
            <td class="p-3">${item.Nama_Saksi} (${item.NRP_Saksi})</td>
            <td class="p-3 font-bold text-blue-600">${item.Total_Suara_Masuk}</td>
            <td class="p-3"><span class="px-2 py-1 bg-green-100 text-green-700 rounded-md text-xs font-bold">${item.Status_Verifikasi}</span></td>
          </tr>
        `;
      });
    }

    // Auto update tiap 5 detik (5000 ms)
    setInterval(loadData, 5000);
    loadData();
  </script>
</body>
</html>
