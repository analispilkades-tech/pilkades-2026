<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel Admin & Audit Pilkades 2026</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col justify-between font-sans">

  <!-- Header -->
  <header class="bg-slate-800 border-b border-slate-700 p-4 shadow-lg">
    <div class="max-w-7xl mx-auto flex justify-between items-center">
      <div>
        <span class="text-xs font-bold text-blue-400 uppercase tracking-widest">Polres Wonosobo</span>
        <h1 class="text-xl font-extrabold text-white">PANEL AUDIT & VERIFIKASI C1</h1>
      </div>
      <div class="flex items-center space-x-4">
        <span id="adminNameDisplay" class="text-xs text-slate-300 font-mono hidden md:inline">Logged as: Admin</span>
        <button onclick="logoutAdmin()" class="bg-rose-600 hover:bg-rose-700 text-white text-xs font-bold px-3 py-2 rounded-lg transition">
          Keluar (Logout)
        </button>
      </div>
    </div>
  </header>

  <!-- Container Utama -->
  <div class="max-w-7xl mx-auto p-4 md:p-6 w-full flex-grow">
    
    <!-- Tab Navigasi & Filter Status -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
      <button onclick="setFilterStatus('PENDING')" id="tabPending" class="bg-slate-800 hover:bg-slate-700 border border-amber-500/50 p-4 rounded-xl text-left transition shadow-md">
        <div class="text-xs text-amber-400 font-semibold uppercase">⚠️ Perlu Audit / Review</div>
        <div id="countPending" class="text-2xl font-extrabold text-white mt-1">0 TPS</div>
      </button>

      <button onclick="setFilterStatus('VERIFIED')" id="tabVerified" class="bg-slate-800 hover:bg-slate-700 border border-emerald-500/50 p-4 rounded-xl text-left transition shadow-md">
        <div class="text-xs text-emerald-400 font-semibold uppercase">✅ Terverifikasi / Sah</div>
        <div id="countVerified" class="text-2xl font-extrabold text-white mt-1">0 TPS</div>
      </button>

      <button onclick="setFilterStatus('ALL')" id="tabAll" class="bg-slate-800 hover:bg-slate-700 border border-blue-500/50 p-4 rounded-xl text-left transition shadow-md">
        <div class="text-xs text-blue-400 font-semibold uppercase">📋 Semua Data Livecount</div>
        <div id="countAll" class="text-2xl font-extrabold text-white mt-1">0 TPS</div>
      </button>
    </div>

    <!-- Tabel Data Interaktif -->
    <div class="bg-slate-800 rounded-2xl border border-slate-700 shadow-xl p-6">
      <div class="flex flex-col md:flex-row justify-between items-center mb-4 gap-3">
        <h2 id="tableTitle" class="text-lg font-bold text-white">Daftar Data Masuk</h2>
        <input type="text" id="searchQuery" oninput="applyTableFilter()" placeholder="Cari Desa / Kecamatan / Petugas..." class="p-2 bg-slate-900 border border-slate-700 rounded-lg text-sm text-white w-full md:w-72 focus:outline-none focus:ring-2 focus:ring-blue-500">
      </div>

      <div class="overflow-x-auto">
        <table class="w-full text-left text-sm border-collapse">
          <thead>
            <tr class="bg-slate-900/50 text-slate-400 border-b border-slate-700">
              <th class="p-3">Lokasi (Kec / Desa / TPS)</th>
              <th class="p-3">Petugas</th>
              <th class="p-3 text-center">Perolehan Suara</th>
              <th class="p-3 text-center">Total</th>
              <th class="p-3 text-center">Status</th>
              <th class="p-3 text-center">Foto Plano</th>
            </tr>
          </thead>
          <tbody id="adminTableBody" class="divide-y divide-slate-700/50 text-slate-300">
            <tr><td colspan="6" class="text-center py-8 text-slate-500">Memuat data audit...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- Footer -->
  <footer class="bg-slate-950 border-t border-slate-800 py-4 text-center text-xs text-slate-500">
    <p>&copy; 2026 brengos ntd. Sistem Pengamanan & Audit Pilkades Polres Wonosobo.</p>
  </footer>

  <script>
    let globalData = [];
    let currentFilter = 'PENDING';

    document.addEventListener("DOMContentLoaded", () => {
      const adminNama = localStorage.getItem("adminNama") || "Admin";
      document.getElementById("adminNameDisplay").innerText = `Logged as: ${adminNama}`;
      fetchAdminData();
      setInterval(fetchAdminData, 10000);
    });

    async function fetchAdminData() {
      try {
        const res = await fetch('/api/get-data');
        const result = await res.json();
        globalData = result.data || result || [];
        
        updateTabCounts();
        applyTableFilter();
      } catch (err) {
        console.error("Gagal memuat data admin:", err);
      }
    }

    function setFilterStatus(status) {
      currentFilter = status;
      applyTableFilter();
    }

    function updateTabCounts() {
      const pendingCount = globalData.filter(d => ['PLANO TIDAK SESUAI', 'FOTO PLANO BELUM TERVERIFIKASI', 'MEMERLUKAN VERIFIKASI ADMIN'].includes(d.status_verifikasi)).length;
      const verifiedCount = globalData.filter(d => ['AUTO VERIFIED', 'AUTO_VERIFIED', 'EDITED_BY_SAKSI'].includes(d.status_verifikasi)).length;
      
      document.getElementById("countPending").innerText = `${pendingCount} TPS`;
      document.getElementById("countVerified").innerText = `${verifiedCount} TPS`;
      document.getElementById("countAll").innerText = `${globalData.length} TPS`;
    }

    function applyTableFilter() {
      const search = document.getElementById("searchQuery").value.toLowerCase();
      
      let filtered = globalData.filter(item => {
        const matchSearch = String(item.desa || '').toLowerCase().includes(search) ||
                            String(item.kecamatan || '').toLowerCase().includes(search) ||
                            String(item.nama_saksi || '').toLowerCase().includes(search);
        
        if (!matchSearch) return false;

        if (currentFilter === 'PENDING') {
          return ['PLANO TIDAK SESUAI', 'FOTO PLANO BELUM TERVERIFIKASI', 'MEMERLUKAN VERIFIKASI ADMIN'].includes(item.status_verifikasi);
        } else if (currentFilter === 'VERIFIED') {
          return ['AUTO VERIFIED', 'AUTO_VERIFIED', 'EDITED_BY_SAKSI'].includes(item.status_verifikasi);
        }
        return true;
      });

      renderAdminTable(filtered);
    }

    function renderAdminTable(data) {
      const tbody = document.getElementById("adminTableBody");
      tbody.innerHTML = "";

      if (data.length === 0) {
        tbody.innerHTML = `<tr><td colspan="6" class="text-center py-8 text-slate-500">Tidak ada data dalam kategori ini.</td></tr>`;
        return;
      }

      data.forEach(item => {
        const photoLink = item.google_drive_url 
          ? `<a href="${item.google_drive_url}" target="_blank" class="bg-blue-600 hover:bg-blue-500 text-white px-3 py-1.5 rounded-lg text-xs font-bold inline-block shadow">📁 Buka Foto</a>`
          : '<span class="text-slate-500 text-xs italic">Belum Ada Foto</span>';

        tbody.innerHTML += `
          <tr class="hover:bg-slate-700/30 transition">
            <td class="p-3">
              <strong class="text-white">${item.desa || '-'}</strong><br>
              <span class="text-xs text-slate-400">Kec. ${item.kecamatan || '-'} • TPS ${item.tps || '-'}</span>
            </td>
            <td class="p-3 text-xs">
              ${item.nama_saksi || '-'}<br>
              <span class="text-slate-500">NRP: ${item.nrp_saksi || '-'}</span>
            </td>
            <td class="p-3 text-center font-mono text-xs">
              01: ${item.suara_calon_01 || 0} | 02: ${item.suara_calon_02 || 0}
              ${item.suara_calon_03 !== null && item.suara_calon_03 !== undefined ? `| 03: ${item.suara_calon_03}` : ''}
              <br><span class="text-slate-500">Tidak Sah: ${item.suara_tidak_sah || 0}</span>
            </td>
            <td class="p-3 text-center font-bold text-white">${item.total_suara_masuk || 0}</td>
            <td class="p-3 text-center">
              <span class="px-2 py-1 bg-slate-700 text-amber-400 rounded text-xs font-bold">
                ${item.status_verifikasi || 'PENDING'}
              </span>
            </td>
            <td class="p-3 text-center">
              ${photoLink}
            </td>
          </tr>
        `;
      });
    }

    function logoutAdmin() {
      localStorage.removeItem("adminToken");
      localStorage.removeItem("adminNama");
      window.location.href = "/login";
    }
  </script>
</body>
</html>
