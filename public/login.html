<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Admin - Audit Pilkades 2026</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 min-h-screen flex flex-col justify-between p-4">

  <div class="flex-grow flex items-center justify-center">
    <div class="bg-white rounded-2xl shadow-2xl p-8 max-w-md w-full border border-slate-700">
      <div class="text-center mb-6">
        <div class="bg-blue-100 text-blue-800 text-xs font-bold px-3 py-1 rounded-full inline-block mb-2">
          RESTRICTED ACCESS
        </div>
        <h1 class="text-2xl font-bold text-slate-800">Login Verifikator</h1>
        <p class="text-sm text-slate-500">Aplikasi Hitung Cepat Pilkades 2026</p>
      </div>

      <div id="alertError" class="hidden bg-rose-100 border border-rose-400 text-rose-700 px-4 py-3 rounded mb-4 text-sm"></div>

      <form id="loginForm" onsubmit="handleLoginSubmit(event)" class="space-y-4">
        <div>
          <label class="block text-sm font-semibold text-slate-700 mb-1">Username</label>
          <input type="text" id="username" required autocomplete="username" class="w-full p-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-600 focus:outline-none text-sm">
        </div>

        <div>
          <label class="block text-sm font-semibold text-slate-700 mb-1">Password</label>
          <input type="password" id="password" required autocomplete="current-password" class="w-full p-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-600 focus:outline-none text-sm">
        </div>

        <button type="submit" id="btnLogin" class="w-full bg-blue-900 hover:bg-blue-800 text-white font-bold py-3 rounded-lg shadow-lg transition duration-200">
          Masuk Panel Admin
        </button>
      </form>
    </div>
  </div>

  <!-- Footer Copyright -->
  <footer class="py-4 text-center text-xs text-slate-500">
    <p>&copy; 2026 brengos ntd. All Rights Reserved.</p>
  </footer>

  <script>
    const API_URL = "/api/admin-action";

    async function handleLoginSubmit(e) {
      e.preventDefault();
      const btn = document.getElementById("btnLogin");
      const alertError = document.getElementById("alertError");
      
      btn.innerText = "Memverifikasi...";
      btn.disabled = true;
      alertError.classList.add("hidden");

      const payload = {
        action: "login",
        username: document.getElementById("username").value.trim(),
        password: document.getElementById("password").value.trim()
      };

      try {
        const res = await fetch(API_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });

        const result = await res.json().catch(() => null);

        if (res.ok && (result?.success || result?.ok)) {
          // Simpan sesi autentikasi ke localStorage
          localStorage.setItem("adminToken", result.role || "AUTHENTICATED");
          localStorage.setItem("adminNama", result.nama || result.nama_lengkap || "Admin");
          
          // Redireksi ke dasbor admin
          window.location.href = "/admin";
        } else {
          alertError.innerText = result?.message || result?.error || "Username atau Password salah!";
          alertError.classList.remove("hidden");
        }
      } catch (err) {
        console.error("LOGIN ERROR:", err);
        alertError.innerText = "Gagal terhubung ke server autentikasi.";
        alertError.classList.remove("hidden");
      } finally {
        btn.innerText = "Masuk Panel Admin";
        btn.disabled = false;
      }
    }
  </script>
</body>
</html>
