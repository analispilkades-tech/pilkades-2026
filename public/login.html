<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    Login Admin - Audit Pilkades 2026
  </title>

  <script src="https://cdn.tailwindcss.com"></script>
</head>


<body
  class="bg-slate-900 min-h-screen flex flex-col justify-between p-4"
>


<!-- =====================================================
     LOGIN
====================================================== -->

<div
  class="flex-grow flex items-center justify-center"
>

  <div
    class="bg-white rounded-2xl shadow-2xl p-8 max-w-md w-full"
  >

    <!-- HEADER -->

    <div class="text-center mb-6">

      <div
        class="bg-blue-100 text-blue-800 text-xs font-bold px-3 py-1 rounded-full inline-block mb-2"
      >
        RESTRICTED ACCESS
      </div>

      <h1
        class="text-2xl font-bold text-slate-800"
      >
        Login Admin
      </h1>

      <p
        class="text-sm text-slate-500 mt-1"
      >
        Panel Audit & Verifikasi Pilkades 2026
      </p>

    </div>


    <!-- ERROR -->

    <div
      id="alertError"
      class="hidden bg-rose-100 border border-rose-400 text-rose-700 px-4 py-3 rounded-lg mb-4 text-sm"
    ></div>


    <!-- FORM -->

    <form
      id="loginForm"
      onsubmit="loginAdmin(event)"
      class="space-y-4"
    >

      <!-- NRP -->

      <div>

        <label
          for="nrp"
          class="block text-sm font-semibold text-slate-700 mb-1"
        >
          NRP
        </label>

        <input
          type="text"
          id="nrp"
          name="nrp"
          required
          autocomplete="username"
          inputmode="numeric"
          placeholder="Masukkan NRP"
          class="w-full p-3 border border-slate-300 rounded-lg
                 focus:ring-2 focus:ring-blue-600
                 focus:outline-none text-sm text-slate-800"
        >

      </div>


      <!-- PIN -->

      <div>

        <label
          for="pin"
          class="block text-sm font-semibold text-slate-700 mb-1"
        >
          PIN
        </label>

        <input
          type="password"
          id="pin"
          name="pin"
          required
          autocomplete="current-password"
          inputmode="numeric"
          placeholder="Masukkan PIN"
          class="w-full p-3 border border-slate-300 rounded-lg
                 focus:ring-2 focus:ring-blue-600
                 focus:outline-none text-sm text-slate-800"
        >

      </div>


      <!-- BUTTON -->

      <button
        type="submit"
        id="btnLogin"
        class="w-full bg-blue-900 hover:bg-blue-800
               disabled:bg-slate-400
               text-white font-bold py-3 rounded-lg
               shadow-lg transition duration-200"
      >
        Masuk Panel Admin
      </button>

    </form>


    <!-- INFO -->

    <div
      class="mt-5 text-center text-xs text-slate-400"
    >
      Sistem autentikasi menggunakan NRP & PIN.
    </div>

  </div>

</div>


<!-- =====================================================
     FOOTER
====================================================== -->

<footer
  class="py-4 text-center text-xs text-slate-500"
>

  <p>
    &copy; 2026 brengos ntd.
    All Rights Reserved.
  </p>

</footer>



<script>

/*
=========================================================
LOGIN ADMIN
=========================================================
*/

async function loginAdmin(event) {

  event.preventDefault();


  const btn =
    document.getElementById(
      'btnLogin'
    );

  const alertError =
    document.getElementById(
      'alertError'
    );

  const nrp =
    document
      .getElementById('nrp')
      .value
      .trim();

  const pin =
    document
      .getElementById('pin')
      .value
      .trim();


  /*
  -------------------------------------------------------
  RESET ERROR
  -------------------------------------------------------
  */

  alertError.classList.add(
    'hidden'
  );

  alertError.innerText = '';


  /*
  -------------------------------------------------------
  VALIDASI
  -------------------------------------------------------
  */

  if (!nrp || !pin) {

    alertError.innerText =
      'NRP dan PIN wajib diisi.';

    alertError.classList.remove(
      'hidden'
    );

    return;

  }


  /*
  -------------------------------------------------------
  BUTTON
  -------------------------------------------------------
  */

  btn.disabled = true;

  btn.innerText =
    'Memverifikasi...';


  try {

    /*
    -----------------------------------------------------
    LOGIN KE SESSION SYSTEM
    -----------------------------------------------------
    */

    const res =
      await fetch(
        '/api/admin-login',
        {
          method: 'POST',

          headers: {
            'Content-Type':
              'application/json'
          },

          credentials: 'same-origin',

          body:
            JSON.stringify({
              nrp,
              pin
            })
        }
      );


    /*
    -----------------------------------------------------
    AMBIL RESPONSE SEBAGAI TEXT
    -----------------------------------------------------

    Jangan langsung res.json().
    */

    const rawText =
      await res.text();


    let result = null;


    try {

      result =
        rawText
          ? JSON.parse(rawText)
          : null;

    } catch (jsonError) {

      console.error(
        'LOGIN NON JSON:',
        rawText
      );

      throw new Error(
        `Server mengembalikan response tidak valid. HTTP ${res.status}`
      );

    }


    /*
    -----------------------------------------------------
    CEK HASIL LOGIN
    -----------------------------------------------------
    */

    if (
      !res.ok ||
      !result ||
      !result.ok
    ) {

      throw new Error(
        result?.error ||
        result?.message ||
        `Login gagal. HTTP ${res.status}`
      );

    }


    /*
    -----------------------------------------------------
    SESSION BERHASIL DIBUAT
    -----------------------------------------------------
    */

    console.log(
      '[ADMIN LOGIN] Session berhasil dibuat.',
      {
        nama: result.nama,
        role: result.role,
        kecamatan: result.kecamatan
      }
    );


    /*
    -----------------------------------------------------
    MASUK DASHBOARD
    -----------------------------------------------------
    */

    window.location.href =
      '/admin';


  } catch (error) {

    console.error(
      '[ADMIN LOGIN ERROR]',
      error
    );


    alertError.innerText =
      error?.message ||
      'Login gagal. Silakan coba lagi.';


    alertError.classList.remove(
      'hidden'
    );


  } finally {

    btn.disabled = false;

    btn.innerText =
      'Masuk Panel Admin';

  }

}

</script>

</body>
</html>
